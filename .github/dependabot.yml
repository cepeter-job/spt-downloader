version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Playwright 1.64.1 requires pyee >=13,<15; avoid unresolvable grouped PRs.
    ignore:
      - dependency-name: pyee
        versions: [">=15"]
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
