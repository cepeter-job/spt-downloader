name: Selection shortcuts probe
on:
  push:
    branches: [codex/spt-selection-shortcuts]
permissions:
  contents: read
jobs:
  selection:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          python-version: '3.14.8'
          enable-cache: true
          cache-python: true
          save-cache: false
          cache-dependency-glob: locks/test.txt
      - name: Prepare locked Windows test environment
        shell: pwsh
        run: |
          uv python install cpython-3.14.8-windows-x86_64-none --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python 3.14.8+gil .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: locks/test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv/Scripts/python.exe
      - name: Exercise selection shortcut behavior
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pytest tests/test_desktop_selection_shortcuts.py -k "aliases or contradictory" -q --basetemp "$env:RUNNER_TEMP/selection-shortcut-tests" --junitxml "$env:RUNNER_TEMP/selection-shortcuts.xml" -o junit_logging=no -o junit_log_passing_tests=false
          exit $LASTEXITCODE
      - name: Retain synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: selection-shortcuts-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/selection-shortcuts.xml
          if-no-files-found: error
          retention-days: 14
