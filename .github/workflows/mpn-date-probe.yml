name: MPN transaction-date reproduction probe
on:
  pull_request:
    branches: [main]
    paths:
      - coretax_mpn_ui.py
      - coretax_mpn_browser.py
      - tests/test_mpn_capture_browser.py
      - tests/test_mpn_transaction_date_clear.py
      - tests/test_mpn_date_review.py
      - tests/test_mpn_action_custody.py
      - .github/workflows/mpn-date-probe.yml
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          enable-cache: false
      - name: Install the production-profile locked test environment
        run: |
          uv python install cpython-3.14.8-windows-x86_64-none --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python 3.14.8+gil .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: locks/test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record original source identities
        run: |
          @'
          import hashlib,json,os
          from pathlib import Path
          names=['coretax_mpn_ui.py','coretax_mpn_browser.py','tests/test_mpn_capture_browser.py','tests/test_mpn_transaction_date_clear.py','tests/test_mpn_date_review.py','tests/test_mpn_action_custody.py','locks/test.txt']
          data={'sha':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'files':{name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names}}
          (Path(os.environ['RUNNER_TEMP'])/'mpn-date-source.json').write_text(json.dumps(data),encoding='utf-8')
          '@ | .venv/Scripts/python.exe -I -S -
      - name: Reproduce review failures against the original reviewed production
        run: |
          @'
          import hashlib,json,os,subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          names=['coretax_mpn_ui.py','coretax_mpn_browser.py']
          held={name:Path(name).read_bytes() for name in names}
          base='9adcd18a399e903be148dfea866420d95b45565d'
          metadata={'production_head':base,'files':{}}
          try:
              for name in names:
                  raw=subprocess.check_output(['git','show',base+':'+name])
                  Path(name).write_bytes(raw)
                  metadata['files'][name]=hashlib.sha256(raw).hexdigest()
              target=Path(os.environ['RUNNER_TEMP'])/'mpn-review-red.xml'
              args=['.venv/Scripts/python.exe','-m','pytest','tests/test_mpn_date_review.py','tests/test_mpn_transaction_date_clear.py','-k','test_second_search_waits or test_missing_date_container or test_detached_date_metadata or test_date_click_error or sibling_table','-q','--basetemp',os.environ['RUNNER_TEMP']+'/mpn-red-review','--junitxml',str(target)]
              result=subprocess.run(args,check=False)
              cases=ET.parse(target).getroot().findall('.//testcase')
              assert result.returncode==1 and len(cases)==6
              assert len([c for c in cases if c.find('failure') is not None])==6
              assert not any(c.find('error') is not None or c.find('skipped') is not None for c in cases)
              metadata['cases']=len(cases)
              metadata['expected_failures']=6
              (Path(os.environ['RUNNER_TEMP'])/'mpn-review-red-source.json').write_text(json.dumps(metadata),encoding='utf-8')
          finally:
              for name,raw in held.items():
                  Path(name).write_bytes(raw)
          '@ | .venv/Scripts/python.exe -I -S -
      - name: Reproduce only the inspected transaction-date contract
        run: .venv/Scripts/python.exe -m pytest tests/test_mpn_transaction_date_clear.py tests/test_mpn_date_review.py tests/test_mpn_action_custody.py -q --basetemp "$env:RUNNER_TEMP/mpn-date-probe" --junitxml="$env:RUNNER_TEMP/mpn-date-results.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mpn-date-probe-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mpn-date-results.xml
            ${{ runner.temp }}/mpn-date-source.json
            ${{ runner.temp }}/mpn-review-red.xml
            ${{ runner.temp }}/mpn-review-red-source.json
          if-no-files-found: error
