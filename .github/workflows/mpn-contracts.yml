# Temporary branch-only RED/GREEN feedback. Remove before integration.
# The existing complete Windows/portable/package workflow remains required.
name: MPN contract diagnostics

on:
  push:
    branches: [codex/mpn-per-job]

permissions:
  contents: read

concurrency:
  group: mpn-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Synthetic MPN and resume contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.4'
          checksum: '2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f'
          python-version: '3.14.8'
          enable-cache: true
          cache-python: true
          save-cache: false
          cache-dependency-glob: locks/test.txt
          cache-suffix: Linux-X64-python3.14.8-portable
      - name: Prepare pinned synthetic test runtime
        run: |
          uv python install cpython-3.14.8-linux-x86_64-gnu --no-bin --no-registry
          uv venv --managed-python --python 3.14.8+gil .venv
          uv pip sync --python .venv/bin/python --require-hashes --only-binary :all: locks/test.txt
          uv pip check --python .venv/bin/python
      - name: Run scoped synthetic contracts
        run: >-
          .venv/bin/python -m pytest tests/test_mpn.py tests/test_mpn_browser.py
          tests/test_resume_template.py tests/test_mpn_publication.py
          tests/test_mpn_capture_protocol.py
          tests/test_mpn_job_flow.py
          tests/test_exporter.py tests/test_audit_mapping_header.py
          tests/test_split_output.py tests/test_output_safety.py
          tests/test_desktop_output.py tests/test_desktop_overwrite.py -q
          --basetemp "$RUNNER_TEMP/mpn-contract-tests"
          --junitxml "$RUNNER_TEMP/mpn-contract-results.xml"
          -o junit_logging=no -o junit_log_passing_tests=false
      - name: Retain synthetic results including RED
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mpn-contract-results-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/mpn-contract-results.xml
          if-no-files-found: warn
