name: Phase 2 performance evidence (temporary)
on:
  pull_request:
    branches: [perf/ui-b-phase2-latency]
    paths:
      - '.github/workflows/p2-performance-evidence.yml'
      - 'scripts/_p2_performance_probe.py'
      - 'scripts/_p2_layout_trace.py'
      - 'scripts/_p2_latency_comparison.py'
permissions:
  contents: read
concurrency:
  group: p2-performance-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  evidence:
    name: Paired exact-commit timings, native scaling and separate profiling
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: df8e7589fe6550d639142971483c65beef4b37d9
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: d59a019c9c7cfc24af617ace824c69d7ede58d53
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 67396564dd12b8a3d9eb8cd08920316cf83ae2d3
          path: historical
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Prepare pinned production interpreter and locked environment
        shell: pwsh
        run: |
          uv python install 'cpython-3.14.8-windows-x86_64-none' --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python '3.14.8+gil' .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: candidate/locks/test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure unchanged methodology and capture native dialogs
        shell: pwsh
        run: |
          .venv/Scripts/python.exe harness/scripts/_p2_latency_comparison.py --baseline baseline --candidate candidate --historical historical/scripts/_p2_dialog_evidence.py --out "$env:RUNNER_TEMP/p2-performance-final"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve synthetic timing, profile and original PNG evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p2-performance-final-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/p2-performance-final/
