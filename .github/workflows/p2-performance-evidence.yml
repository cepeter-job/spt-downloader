name: Phase 2 performance evidence (temporary)
on:
  pull_request:
    branches: [perf/ui-b-phase2-latency]
    paths:
      - '.github/workflows/p2-performance-evidence.yml'
      - 'scripts/_p2_performance_probe.py'
      - 'scripts/_p2_layout_trace.py'
permissions:
  contents: read
concurrency:
  group: p2-performance-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  evidence:
    name: Trace duplicate native Configure events on unchanged candidate
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: d9336e382541d30f1fa837e5735b9b748e4c3657
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 67396564dd12b8a3d9eb8cd08920316cf83ae2d3
          path: historical
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Recreate unchanged candidate and trace mapping events
        shell: pwsh
        run: |
          uv python install 'cpython-3.14.8-windows-x86_64-none' --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python '3.14.8+gil' .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: source/locks/test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe harness/scripts/_p2_performance_probe.py prepare --source source --out "$env:RUNNER_TEMP/p2-configure-trace"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe harness/scripts/_p2_layout_trace.py --source source --historical historical/scripts/_p2_dialog_evidence.py --out "$env:RUNNER_TEMP/p2-configure-trace/trace.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original candidate and native event trace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p2-configure-trace-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/p2-configure-trace/
