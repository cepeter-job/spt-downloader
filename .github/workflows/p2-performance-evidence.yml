name: Phase 2 performance evidence (temporary)
on:
  pull_request:
    branches: [perf/ui-b-phase2-latency]
    paths:
      - '.github/workflows/p2-performance-evidence.yml'
      - 'scripts/_p2_performance_probe.py'
permissions:
  contents: read
concurrency:
  group: p2-performance-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  evidence:
    name: Observe exact readiness RED and layout profile
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
          ref: 0fa42b4bb9f0829fe64e6f655f59c0941ec7a2e8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: historical-probe
          ref: 67396564dd12b8a3d9eb8cd08920316cf83ae2d3
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Prepare exact interpreter and hash-locked tests
        shell: pwsh
        run: |
          uv python install 'cpython-3.14.8-windows-x86_64-none' --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python '3.14.8+gil' .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: source/locks/test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/p2-readiness-red" | Out-Null
      - name: Profile modal construction and deferred layout separately
        shell: pwsh
        run: |
          .venv/Scripts/python.exe harness/scripts/_p2_performance_probe.py --source source --revision 0fa42b4bb9f0829fe64e6f655f59c0941ec7a2e8 --historical historical-probe/scripts/_p2_dialog_evidence.py --out "$env:RUNNER_TEMP/p2-readiness-red/profile.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe test-only readiness failures before implementation
        shell: pwsh
        working-directory: source
        run: |
          ../.venv/Scripts/python.exe -m pytest -q tests/test_desktop_dialog_readiness.py --basetemp "$env:RUNNER_TEMP/p2-readiness-red-tests" --junitxml "$env:RUNNER_TEMP/p2-readiness-red/results.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact synthetic RED and profile evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p2-readiness-red-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/p2-readiness-red/
