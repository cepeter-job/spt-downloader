name: Phase 2 performance evidence (temporary)
on:
  pull_request:
    branches: [perf/ui-b-phase2-latency]
    paths:
      - '.github/workflows/p2-performance-evidence.yml'
      - 'scripts/_p2_performance_probe.py'
permissions:
  contents: read
concurrency:
  group: p2-performance-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  evidence:
    name: Prepare and validate exact dependency repair
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
          ref: 198edafdd24f6fb37ac60b34caea60540ade72e3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: dependency
          ref: 4f893e5fb0b1b509892eac0b25025671dc3506cd
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Prepare pinned interpreter and exact source patch
        shell: pwsh
        run: |
          uv python install 'cpython-3.14.8-windows-x86_64-none' --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python '3.14.8+gil' .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe harness/scripts/_p2_performance_probe.py prepare --source source --dependency dependency --out "$env:RUNNER_TEMP/p2-dependency"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: source/locks/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python '3.14.8+gil' .audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .audit/Scripts/python.exe --require-hashes --only-binary :all: source/locks/audit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify canonical lock freshness and targeted regressions
        shell: pwsh
        working-directory: source
        run: |
          ../.venv/Scripts/python.exe -m scripts.update_locks --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../.venv/Scripts/python.exe -m pytest -q tests/test_workflow_contracts.py tests/test_unified_login_flow.py tests/test_desktop_runtime.py --basetemp "$env:RUNNER_TEMP/p2-dependency-tests" --junitxml "$env:RUNNER_TEMP/p2-dependency/targeted.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify strict dependency audit
        shell: pwsh
        run: |
          .audit/Scripts/python.exe -m pip_audit --path .venv/Lib/site-packages --path .audit/Lib/site-packages --strict --progress-spinner off --format json --output "$env:RUNNER_TEMP/p2-dependency/audit.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish reviewed source objects only, never refs or commits
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/Scripts/python.exe harness/scripts/_p2_performance_probe.py publish --source source --out "$env:RUNNER_TEMP/p2-dependency"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve source and synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p2-dependency-repair-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/p2-dependency/
