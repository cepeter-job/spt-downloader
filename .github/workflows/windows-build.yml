name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_mode:
        description: Full Windows validation mode for a same-commit pipeline comparison
        type: choice
        default: two-shards
        options: [serial, two-shards]
      cache_mode:
        description: Restore available caches or measure a cold full pipeline
        type: choice
        default: restore
        options: [restore, cold]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  # Each main push keeps its own active/pending slot: a later docs-only push
  # cannot cancel or replace the preceding code build. PR updates still coalesce.
  group: windows-build-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

# Python 3.14.8 adalah satu-satunya profil produksi; matrix dibangkitkan
# dari spt_desktop/runtime.py. Setiap runner menjalankan satu proses pytest;
# Tk, Credential Manager, dan proses milik aplikasi tetap serial pada setiap runner.
# Build baru dimulai setelah tes Windows/portable dan audit lulus.
jobs:
  route:
    name: Route changes and validate workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      python_matrix: ${{ steps.route.outputs.python_matrix }}
      production_python: ${{ steps.route.outputs.production_python }}
      windows_mode: ${{ steps.route.outputs.windows_mode }}
      cache_mode: ${{ steps.route.outputs.cache_mode }}
      windows_matrix: ${{ steps.route.outputs.windows_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Route the actual changed paths, defaulting to full validation
        id: route
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WINDOWS_MODE_INPUT: ${{ inputs.windows_mode }}
          CACHE_MODE_INPUT: ${{ inputs.cache_mode }}
        run: python3 -m scripts.ci_route route
      - name: Validate Actions syntax with verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --status
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes=''

  portable:
    name: Portable tests (Python ${{ matrix.python }})
    needs: route
    if: needs.route.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.route.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark setup timing after checkout
        run: python -m scripts.ci_report start
      - name: Set up pinned uv, wheel cache and managed Python cache
        id: uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          checksum: '2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f'
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-python: true
          restore-cache: ${{ needs.route.outputs.cache_mode != 'cold' }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-dependency-glob: |
            requirements*.txt
            locks/*.txt
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-python${{ matrix.python }}-portable
      - name: Install the hash-locked portable test environment
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          # Gunakan key katalog exact untuk instalasi baru; +gil dipakai saat discovery.
          uv python install "cpython-${PYTHON_VERSION}-linux-x86_64-gnu" --no-bin --no-registry
          uv venv --managed-python --python "$PYTHON_VERSION+gil" .venv
          uv pip sync --python .venv/bin/python --require-hashes --only-binary :all: locks/test.txt
          uv pip check --python .venv/bin/python
      - name: Verify lock freshness and hashes against the reviewed manifests
        if: matrix.profile == 'production'
        run: .venv/bin/python -m scripts.update_locks --check
      - name: Check undefined Python names with pinned Ruff
        id: lint
        run: .venv/bin/python -m ruff check --output-format github .
      - name: Run portable synthetic tests serially
        id: tests
        env:
          CI_UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
          CI_PYTHON_CACHE_HIT: ${{ steps.uv.outputs.python-cache-hit }}
        run: >-
          .venv/bin/python -m coverage run --rcfile=.coveragerc -m pytest tests
          -p scripts.ci_tests --ci-workload portable -q
          --basetemp "$RUNNER_TEMP/spt-pytest-portable"
          --ci-manifest "$RUNNER_TEMP/test-inventory.json" --durations=10
          --junitxml "$RUNNER_TEMP/test-results.xml"
          -o junit_logging=no -o junit_log_passing_tests=false
      - name: Summarize synthetic test timing and outcomes
        if: always() && steps.tests.outcome != 'skipped'
        run: python -m scripts.ci_report report
      - name: Write portable subset coverage XML
        id: coverage-xml
        if: always() && steps.tests.outcome != 'skipped'
        run: .venv/bin/python -m coverage xml --rcfile=.coveragerc -o "$RUNNER_TEMP/coverage-portable.xml"
      - name: Write portable subset coverage JSON
        id: coverage-json
        if: always() && steps.tests.outcome != 'skipped'
        run: .venv/bin/python -m coverage json --rcfile=.coveragerc -o "$RUNNER_TEMP/coverage-portable.json"
      - name: Publish synthetic collection evidence
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-inventory-portable-python${{ matrix.python }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic JUnit and measurements even after test failure
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-portable-python${{ matrix.python }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-results.xml
            ${{ runner.temp }}/test-measurements.json
            ${{ runner.temp }}/coverage-portable.xml
            ${{ runner.temp }}/coverage-portable.json
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows integration (Python ${{ matrix.python }}, ${{ matrix.mode }})
    needs: route
    if: needs.route.outputs.mode == 'full'
    runs-on: windows-2022
    # Tests alone took 19m32s; budget for setup, uploads, and cleanup too.
    # Keep bounded headroom without skipping tests or weakening package gates.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.route.outputs.windows_matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark setup timing after checkout
        run: python -m scripts.ci_report start
      - name: Set up pinned uv, wheel cache and managed Python cache
        id: uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-python: true
          restore-cache: ${{ needs.route.outputs.cache_mode != 'cold' }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (matrix.mode == 'serial' || matrix.mode == 'shard-0') }}
          cache-dependency-glob: |
            requirements*.txt
            locks/*.txt
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-python${{ matrix.python }}-integration
      - name: Install the hash-locked Windows test environment
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          python -I -S scripts/ci_python_cache.py --python-version "$env:PYTHON_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Key katalog exact memilih distribusi x64/GIL pada instalasi baru.
          uv python install "cpython-${env:PYTHON_VERSION}-windows-x86_64-none" --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python "$env:PYTHON_VERSION+gil" .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: locks/test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv/Scripts/python.exe
      - name: Run the selected Windows partition including native, Tk and Edge fixtures
        id: tests
        env:
          CI_UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
          CI_PYTHON_CACHE_HIT: ${{ steps.uv.outputs.python-cache-hit }}
          CI_SHARD: ${{ matrix.shard }}
        run: |
          $pytestArgs = @(
            '-m', 'pytest', 'tests', '-p', 'scripts.ci_tests', '--ci-workload', 'windows', '-q',
            '--basetemp', "$env:RUNNER_TEMP/spt-pytest-windows",
            '--ci-manifest', "$env:RUNNER_TEMP/test-inventory.json", '--durations=10',
            '--junitxml', "$env:RUNNER_TEMP/test-results.xml",
            '-o', 'junit_logging=no', '-o', 'junit_log_passing_tests=false'
          )
          if ($env:CI_SHARD) {
            $pytestArgs += @('--ci-shard', "$env:CI_SHARD")
          }
          & .venv/Scripts/python.exe @pytestArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise fresh managed worker setup and verified reuse
        if: matrix.mode == 'serial' || matrix.mode == 'shard-0'
        env:
          PYTHON_PROFILE: ${{ matrix.profile }}
        run: .venv/Scripts/python.exe -m scripts.ci_runtime --profile "$env:PYTHON_PROFILE"
      - name: Summarize synthetic test timing and outcomes
        if: always() && steps.tests.outcome != 'skipped'
        run: python -m scripts.ci_report report
      - name: Publish synthetic collection evidence
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-inventory-windows-${{ matrix.mode }}-python${{ matrix.python }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic JUnit and measurements even after test failure
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows-${{ matrix.mode }}-python${{ matrix.python }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-results.xml
            ${{ runner.temp }}/test-measurements.json
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Locked dependency audit
    needs: route
    if: needs.route.outputs.mode != 'docs'
    runs-on: windows-2022
    timeout-minutes: 15
    # Audit hanya paket terkunci untuk runtime produksi CPython 3.14.8.
    # Alat audit terisolasi dan ikut diaudit. Database advisory tidak disimpan dalam cache.
    defaults:
      run:
        shell: pwsh
    env:
      PYTHON_VERSION: ${{ needs.route.outputs.production_python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned uv and audit dependency cache
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true
          restore-cache: ${{ needs.route.outputs.cache_mode != 'cold' }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-dependency-glob: |
            requirements*.txt
            locks/*.txt
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-python${{ env.PYTHON_VERSION }}-audit
      - name: Install the locked audited environment and isolated audit tooling
        run: |
          python -I -S scripts/ci_python_cache.py --python-version "$env:PYTHON_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv python install "cpython-${env:PYTHON_VERSION}-windows-x86_64-none" --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python "$env:PYTHON_VERSION+gil" .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: locks/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python "$env:PYTHON_VERSION+gil" .audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .audit/Scripts/python.exe --require-hashes --only-binary :all: locks/audit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .audit/Scripts/python.exe
      - name: Audit installed runtime, test, build and auditor dependencies
        id: audit
        run: >-
          .audit/Scripts/python.exe -m pip_audit
          --path .venv/Lib/site-packages --path .audit/Lib/site-packages
          --strict --progress-spinner off --format json
          --output "$env:RUNNER_TEMP/dependency-audit.json"
      - name: Publish dependency audit report
        if: always() && steps.audit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Windows package (Python ${{ matrix.python }})
    needs: [route, portable, windows, dependency-audit]
    if: needs.route.outputs.mode == 'full'
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.route.outputs.python_matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHON_VERSION: ${{ matrix.python }}
      PYTHON_PROFILE: ${{ matrix.profile }}
      WINDOWS_MODE: ${{ needs.route.outputs.windows_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned uv, build wheel cache and managed Python cache
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-python: true
          restore-cache: ${{ needs.route.outputs.cache_mode != 'cold' }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-dependency-glob: |
            requirements*.txt
            locks/*.txt
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-python${{ matrix.python }}-build
      - name: Install the hash-locked build environment
        run: |
          python -I -S scripts/ci_python_cache.py --python-version "$env:PYTHON_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv python install "cpython-${env:PYTHON_VERSION}-windows-x86_64-none" --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python "$env:PYTHON_VERSION+gil" .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: locks/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv/Scripts/python.exe
      - name: Download this commit's portable test inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-inventory-portable-python${{ matrix.python }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/inventory-portable
      - name: Download this commit's serial Windows test inventory
        if: needs.route.outputs.windows_mode == 'serial'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-inventory-windows-serial-python${{ matrix.python }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/inventory-windows-serial
      - name: Download this commit's original Windows shard 0 inventory
        if: needs.route.outputs.windows_mode == 'two-shards'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-inventory-windows-shard-0-python${{ matrix.python }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/inventory-windows-shard-0
      - name: Download this commit's original Windows shard 1 inventory
        if: needs.route.outputs.windows_mode == 'two-shards'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-inventory-windows-shard-1-python${{ matrix.python }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/inventory-windows-shard-1
      - name: Require full Windows coverage and the matching portable subset before building
        id: inventory
        run: |
          $inventoryArgs = @(
            '-m', 'scripts.ci_tests', "$env:RUNNER_TEMP/inventory-portable/test-inventory.json"
          )
          if ($env:WINDOWS_MODE -eq 'serial') {
            $inventoryArgs += @("$env:RUNNER_TEMP/inventory-windows-serial/test-inventory.json")
          } elseif ($env:WINDOWS_MODE -eq 'two-shards') {
            $inventoryArgs += @(
              "$env:RUNNER_TEMP/inventory-windows-shard-0/test-inventory.json",
              "$env:RUNNER_TEMP/inventory-windows-shard-1/test-inventory.json"
            )
          } else {
            throw 'Unknown Windows execution mode.'
          }
          $inventoryArgs += @(
            '--python-version', "$env:PYTHON_VERSION", '--commit', "$env:GITHUB_SHA",
            '--run-id', "$env:GITHUB_RUN_ID", '--run-attempt', "$env:GITHUB_RUN_ATTEMPT"
          )
          & .venv/Scripts/python.exe @inventoryArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record the immutable build identity before source and frozen self-tests
        run: .venv/Scripts/python.exe -m scripts.ci_artifact build-info . --python-version "$env:PYTHON_VERSION"
      - name: Exercise the source GUI without accounts
        run: .venv/Scripts/python.exe spt_gui.py --self-test --report "$env:RUNNER_TEMP/source-selftest.json"
      - name: Build and exercise the frozen GUI
        run: .venv/Scripts/python.exe build_desktop.py --python-profile "$env:PYTHON_PROFILE" --output dist
      - name: Inventory the actual packaged native bytes and managed worker dependencies
        run: .venv/Scripts/python.exe -m scripts.ci_sbom create dist --python-version "$env:PYTHON_VERSION"
      - name: Validate frozen report and record artifact checksums
        run: .venv/Scripts/python.exe -m scripts.ci_artifact write-checksums dist --python-version "$env:PYTHON_VERSION"
      - name: Upload the exact verified Windows payload
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPTDownloader-Windows-x64-${{ github.sha }}-python${{ matrix.python }}-attempt${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/SPTDownloader.exe
            dist/LICENSE.txt
            dist/README.txt
            dist/build-selftest.json
            dist/build-info.json
            dist/distribution-sbom.json
            dist/SHA256SUMS.txt
      - name: Read back the uploaded artifact by its exact artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/artifact-readback
          merge-multiple: true
      - name: Verify the downloaded bytes and seven-file allowlist
        run: >-
          .venv/Scripts/python.exe -m scripts.ci_artifact verify
          "$env:RUNNER_TEMP/artifact-readback" --python-version "$env:PYTHON_VERSION"
      - name: Exercise clean bootstrap, reuse and owned cancellation from the exact uploaded executable
        id: packaged-runtime
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: >-
          .venv/Scripts/python.exe -m scripts.ci_runtime --profile "$env:PYTHON_PROFILE"
          --executable "$env:RUNNER_TEMP/artifact-readback/SPTDownloader.exe"
          --artifact-id "$env:ARTIFACT_ID" --report "$env:RUNNER_TEMP/packaged-bootstrap.json"
      - name: Retain successful synthetic packaged bootstrap evidence separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-bootstrap-python${{ matrix.python }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/packaged-bootstrap.json
          if-no-files-found: error
          retention-days: 14
      - name: Record verified artifact coordinates
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          "Verified artifact ID $env:ARTIFACT_ID, run $env:GITHUB_RUN_ID, attempt $env:GITHUB_RUN_ATTEMPT, commit $env:GITHUB_SHA, Python $env:PYTHON_VERSION." | Add-Content $env:GITHUB_STEP_SUMMARY
          "Artifact: $env:ARTIFACT_URL" | Add-Content $env:GITHUB_STEP_SUMMARY

  attest:
    name: Artifact provenance (Python ${{ matrix.python }})
    needs: [route, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.route.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.route.outputs.python_matrix) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the already verified artifact from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPTDownloader-Windows-x64-${{ github.sha }}-python${{ matrix.python }}-attempt${{ github.run_attempt }}
          path: verified-artifact
      - name: Verify exact contents before attesting without executing the artifact
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: python3 -m scripts.ci_artifact verify verified-artifact --python-version "$PYTHON_VERSION"
      - name: Attest executable, complete manifest, build identity and distribution SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          subject-path: |
            verified-artifact/SPTDownloader.exe
            verified-artifact/SHA256SUMS.txt
            verified-artifact/build-info.json
            verified-artifact/distribution-sbom.json
      - name: Attest the original uploaded ZIP digest for durable rollback verification
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          subject-name: SPTDownloader-Windows-x64.zip
          subject-digest: sha256:${{ needs.package.outputs.artifact_digest }}

  validate:
    # Pertahankan nama pemeriksaan cabang meskipun pekerjaan CI dipisahkan.
    name: Windows tests and dependency audit
    needs: [route, portable, windows, dependency-audit, package, attest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every workload selected by the routing decision
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -m scripts.ci_route gate

  cleanup:
    name: Clean completed branches
    needs: [route, validate]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.route.result == 'success' && needs.validate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Delete only completed, unchanged branch heads already contained in the tested main
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cleanup_branches.py --repository "$GITHUB_REPOSITORY"
          --base main --expected-base "$GITHUB_SHA" --apply
