name: Temporary MPN reference regression probe
on:
  push:
    branches: [codex/mpn-reference-acquisition]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          python-version: '3.14.8'
          enable-cache: true
          cache-python: true
          save-cache: false
          cache-dependency-glob: locks/test.txt
      - name: Prepare locked runner environment
        shell: pwsh
        run: |
          uv python install cpython-3.14.8-windows-x86_64-none --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python 3.14.8+gil .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: locks/test.txt
          exit $LASTEXITCODE
      - name: Exercise synthetic reference contracts
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pytest tests/test_mpn_reference_acquisition.py -q --basetemp "$env:RUNNER_TEMP/mpn-reference-tests" --junitxml "$env:RUNNER_TEMP/mpn-reference-results.xml" -o junit_logging=no -o junit_log_passing_tests=false
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mpn-reference-probe-${{ github.sha }}
          path: ${{ runner.temp }}/mpn-reference-results.xml
