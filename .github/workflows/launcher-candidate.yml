name: Isolated launcher candidate
on:
  push:
    branches: [feat/tk-accessibility-candidate]
    paths-ignore: ['docs/**', 'scripts/launcher_candidate/README.md']
  workflow_dispatch:
    inputs:
      build_native:
        description: Rebuild native runtime for controlled comparison
        type: boolean
        default: false
env:
  SPT_CANDIDATE_REGRESSION: '1'
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '12400037968'
          run-id: '39718421643'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/contract-runtime
          merge-multiple: true
      - name: Install locked test environment
        shell: pwsh
        run: |
          uv python install cpython-3.14.8-windows-x86_64-none --no-bin --no-registry
          $runtime = "$env:RUNNER_TEMP/contract-runtime"
          if ((Get-FileHash "$runtime/inventory.json").Hash.ToLowerInvariant() -ne '9758f2a63e8815952ca91178a9c20397f4292ad2aca8bfbff0feeb3c87b80239') { throw 'Unverified native inventory' }
          & "$runtime/python.exe" -I -B scripts/launcher_candidate/inventory.py --root $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime custody failed' }
          uv venv --python "$runtime/python.exe" .venv
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: locks/test.txt
      - name: Synthetic inventory contract
        shell: pwsh
        run: .venv/Scripts/python.exe -m pytest tests/test_launcher_candidate_inventory.py tests/test_launcher_candidate_package.py tests/test_launcher_candidate_reader_report.py -q --basetemp "$env:RUNNER_TEMP/candidate-inventory-tests"
  native:
    if: github.event_name == 'workflow_dispatch' && inputs.build_native
    needs: inventory
    outputs:
      runtime-artifact-id: ${{ steps.runtime.outputs.artifact-id }}
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          enable-cache: false
      - name: Install exact bootstrap interpreter
        shell: pwsh
        run: |
          uv python install cpython-3.14.8-windows-x86_64-none --no-bin --no-registry
          $bootstrap = uv python find 3.14.8
          Split-Path -Parent $bootstrap | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build matching isolated CPython Tcl Tk
        shell: pwsh
        run: scripts/launcher_candidate/build.ps1 -Sources scripts/launcher_candidate/sources.json -OutputDirectory "$env:RUNNER_TEMP/launcher-candidate"
      - name: Upload declared runtime only
        id: runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/launcher-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic build and probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-candidate-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/launcher-candidate-evidence/
          if-no-files-found: error
          retention-days: 14

  standalone:
    needs: native
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.native.outputs.runtime-artifact-id }}
          path: ${{ runner.temp }}/relocated-candidate
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          enable-cache: false
      - name: Probe relocated artifact on a fresh runner without native sources
        shell: pwsh
        run: |
          foreach ($name in @('PYTHONHOME', 'PYTHONPATH', 'TCL_LIBRARY', 'TK_LIBRARY', 'TCLLIBPATH')) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
          $runtime = "$env:RUNNER_TEMP/relocated-candidate"
          $evidence = "$env:RUNNER_TEMP/standalone-evidence"
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $probe = "$env:GITHUB_WORKSPACE/scripts/launcher_candidate/probe.py"
          $inventory = "$env:GITHUB_WORKSPACE/scripts/launcher_candidate/inventory.py"
          Push-Location $env:RUNNER_TEMP
          try {
            & "$runtime/python.exe" -I -B $inventory --root $runtime
            if ($LASTEXITCODE -ne 0) { throw 'Read-back inventory failed' }
            & "$runtime/python.exe" -I -B $probe --output "$evidence/relocated-probe.json"
            if ($LASTEXITCODE -ne 0) { throw 'Relocated probe failed' }
            & "$runtime/python.exe" -I -B -m venv --without-pip "$env:RUNNER_TEMP/stdlib-venv"
            if ($LASTEXITCODE -ne 0) { throw 'Standalone stdlib venv creation failed' }
            & "$env:RUNNER_TEMP/stdlib-venv/Scripts/python.exe" -I -B $probe --output "$evidence/stdlib-venv-probe.json"
            if ($LASTEXITCODE -ne 0) { throw 'Standalone venv probe failed' }
          } finally { Pop-Location }
          uv venv --python "$runtime/python.exe" "$env:RUNNER_TEMP/locked-candidate-env"
          if ($LASTEXITCODE -ne 0) { throw 'uv candidate environment failed' }
          uv pip sync --python "$env:RUNNER_TEMP/locked-candidate-env/Scripts/python.exe" --require-hashes --only-binary :all: locks/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked candidate build environment failed' }
          & "$env:RUNNER_TEMP/locked-candidate-env/Scripts/python.exe" -B -m pytest tests/test_launcher_candidate_inventory.py tests/test_launcher_candidate_package.py tests/test_launcher_candidate_reader_report.py -q --basetemp "$env:RUNNER_TEMP/standalone-inventory-tests"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate interpreter inventory tests failed' }
          & "$env:RUNNER_TEMP/locked-candidate-env/Scripts/python.exe" -I -B -m PyInstaller --version
          if ($LASTEXITCODE -ne 0) { throw 'Candidate PyInstaller import failed' }
          & "$runtime/python.exe" -I -B $inventory --root $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime bytes changed during qualification' }
      - name: Upload relocation and virtual-environment evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-standalone-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/standalone-evidence/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: inventory
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      application-artifact-id: ${{ steps.application.outputs.artifact-id }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          enable-cache: false
      - name: Read exact qualified runtime and verify immutable build inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD:scripts/launcher_candidate/build.ps1) -ne '7ba8fdc2dbc317ad3037930124fb1dc55c7d99d8') { throw 'Native build input changed' }
          if ((git rev-parse HEAD:scripts/launcher_candidate/sources.json) -ne '888bf3908eb1371085c9335df14c500e0725d893') { throw 'Native source inputs changed' }
          $metadata = gh api repos/cepeter-job/spt-downloader/actions/artifacts/12400037968 | ConvertFrom-Json
          if ($metadata.workflow_run.id -ne 39718421643 -or $metadata.workflow_run.head_sha -ne '0f699321614550c3d710cf66647878188d5f23ee' -or $metadata.expired) { throw 'Runtime provenance mismatch' }
          if ($metadata.digest -ne 'sha256:87b1ee844efa08398bb110f48335dfd68eeb2241da2bc6c38503e8448305fb4a') { throw 'Runtime API digest mismatch' }
          Invoke-WebRequest -Uri 'https://api.github.com/repos/cepeter-job/spt-downloader/actions/artifacts/12400037968/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN"} -OutFile "$env:RUNNER_TEMP/runtime.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/runtime.zip").Hash.ToLowerInvariant() -ne '87b1ee844efa08398bb110f48335dfd68eeb2241da2bc6c38503e8448305fb4a') { throw 'Runtime archive digest mismatch' }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/runtime.zip" -DestinationPath "$env:RUNNER_TEMP/package-runtime"
          $metadata | ConvertTo-Json -Depth 8 | Set-Content "$env:RUNNER_TEMP/runtime-custody.json"
      - name: Package and exercise exact source and frozen candidate
        shell: pwsh
        run: |
          foreach ($name in @('PYTHONHOME', 'PYTHONPATH', 'TCL_LIBRARY', 'TK_LIBRARY', 'TCLLIBPATH')) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
          & "$env:RUNNER_TEMP/package-runtime/python.exe" -B scripts/launcher_candidate/package.py --runtime "$env:RUNNER_TEMP/package-runtime" --output "$env:RUNNER_TEMP/candidate-application"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate packaging failed' }
      - name: Upload declared unsigned candidate application
        id: application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-application-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-application/
          if-no-files-found: error
          retention-days: 14

  application-readback:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.package.outputs.application-artifact-id }}
          path: ${{ runner.temp }}/readback-application
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          enable-cache: false
      - name: Validate every read-back byte and execute frozen candidate without native sources
        shell: pwsh
        run: |
          uv python install cpython-3.14.8-windows-x86_64-none --no-bin --no-registry
          foreach ($name in @('PYTHONHOME', 'PYTHONPATH', 'TCL_LIBRARY', 'TK_LIBRARY', 'TCLLIBPATH')) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
          uv run --no-project --python 3.14.8 scripts/launcher_candidate/package.py --verify --output "$env:RUNNER_TEMP/readback-application" --report "$env:RUNNER_TEMP/readback-selftest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Exact frozen application readback failed' }
      - name: Verify managed worker bootstrap reuse and owned cancellation from exact candidate bytes
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ needs.package.outputs.application-artifact-id }}
        run: >-
          uv run --no-project --python 3.14.8 -m scripts.ci_runtime --profile production
          --executable "$env:RUNNER_TEMP/readback-application/SPTDownloader.exe"
          --artifact-id "$env:ARTIFACT_ID" --report "$env:RUNNER_TEMP/candidate-packaged-bootstrap.json"
      - name: Retain synthetic read-back proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-application-readback-${{ github.sha }}
          path: |
            ${{ runner.temp }}/readback-selftest.json
            ${{ runner.temp }}/readback-selftest.regression.json
            ${{ runner.temp }}/candidate-packaged-bootstrap.json
          if-no-files-found: error
          retention-days: 14

  readers:
    needs: [package, application-readback]
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        reader: [NVDA, Narrator]
        activation: [before_tk, late]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.package.outputs.application-artifact-id }}
          path: ${{ runner.temp }}/reader-application
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '12400037968'
          run-id: '39718421643'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reader-runtime
          merge-multiple: true
      - name: Verify exact runtime and read-back application custody
        shell: pwsh
        run: |
          $runtime = "$env:RUNNER_TEMP/reader-runtime"
          if ((Get-FileHash "$runtime/inventory.json").Hash.ToLowerInvariant() -ne '9758f2a63e8815952ca91178a9c20397f4292ad2aca8bfbff0feeb3c87b80239') { throw 'Unverified native inventory' }
          & "$runtime/python.exe" -I -B scripts/launcher_candidate/inventory.py --root $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime custody failed' }
          $application = "$env:RUNNER_TEMP/reader-application"
          $manifest = Get-Content "$application/candidate-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.head -ne $env:GITHUB_SHA -or $manifest.run_id -ne $env:GITHUB_RUN_ID) { throw 'Application provenance mismatch' }
          foreach ($file in $manifest.files.PSObject.Properties) {
            if ((Get-FileHash (Join-Path $application $file.Name)).Hash.ToLowerInvariant() -ne $file.Value) { throw 'Application byte mismatch' }
          }
      - name: Acquire official pinned portable NVDA in disposable runner context
        if: matrix.reader == 'NVDA'
        shell: pwsh
        run: |
          $readerInput = Get-Content scripts/launcher_candidate/reader_inputs.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $readerInput.license_url -OutFile "$env:RUNNER_TEMP/nvda-license.txt"
          Invoke-WebRequest -Uri $readerInput.url -OutFile "$env:RUNNER_TEMP/nvda-installer.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP/nvda-installer.exe").Hash.ToLowerInvariant() -ne $readerInput.sha256) { throw 'NVDA acquisition digest mismatch' }
          $installer = Start-Process "$env:RUNNER_TEMP/nvda-installer.exe" -ArgumentList @('--create-portable-silent', ('--portable-path="'+$env:RUNNER_TEMP+'\nvda-portable"')) -WindowStyle Hidden -PassThru
          if (-not $installer.WaitForExit(90000)) { $installer.Kill(); throw 'Portable NVDA acquisition timeout' }
          if ($installer.ExitCode -ne 0) { throw 'Portable NVDA acquisition failed' }
      - name: Observe source and exact read-back frozen password prerequisite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:RUNNER_TEMP/reader-evidence"
          New-Item -ItemType Directory -Path $root | Out-Null
          Copy-Item scripts/launcher_candidate/reader_inputs.json "$root/reader-inputs.json"
          $custody = @{head=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;application_artifact='${{ needs.package.outputs.application-artifact-id }}';application_sha256=(Get-FileHash "$env:RUNNER_TEMP/reader-application/SPTDownloader.exe").Hash.ToLowerInvariant()}
          $custody | ConvertTo-Json | Set-Content "$root/custody.json"
          $probeFailures = @()
          foreach ($mode in @('source','frozen')) {
            $runtime = if ($mode -eq 'source') {"$env:RUNNER_TEMP/reader-runtime/python.exe"} else {"$env:RUNNER_TEMP/reader-application/SPTDownloader.exe"}
            & "$env:RUNNER_TEMP/reader-runtime/python.exe" -B scripts/launcher_candidate/reader_runner.py -Runtime $runtime -Reader '${{ matrix.reader }}' -ActivationTiming '${{ matrix.activation }}' -NvdaPath "$env:RUNNER_TEMP/nvda-portable/nvda.exe" -OutputDirectory "$root/$mode"
            if ($LASTEXITCODE -ne 0) { $probeFailures += $mode; continue }
            & "$env:RUNNER_TEMP/reader-runtime/python.exe" -B scripts/launcher_candidate/reader_report.py --directory "$root/$mode" --inventory "$env:RUNNER_TEMP/reader-runtime/inventory.json"
            if ($LASTEXITCODE -ne 0) { throw 'Reader evidence contract failed' }
          }
          if ($probeFailures.Count) { throw ('Candidate reader scenarios failed: ' + ($probeFailures -join ',')) }
      - name: Retain only sanitized synthetic reader evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-readers-${{ matrix.reader }}-${{ matrix.activation }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reader-evidence/custody.json
            ${{ runner.temp }}/reader-evidence/reader-inputs.json
            ${{ runner.temp }}/reader-evidence/*/report.json
            ${{ runner.temp }}/reader-evidence/*/native.json
            ${{ runner.temp }}/reader-evidence/*/cleanup.json
            ${{ runner.temp }}/reader-evidence/*/owned-tree.json
            ${{ runner.temp }}/reader-evidence/*/startup-failure.json
            ${{ runner.temp }}/reader-evidence/*/probe-phase.json
            ${{ runner.temp }}/reader-evidence/*/probe-exit.json
            ${{ runner.temp }}/reader-evidence/*/probe-failure.json
            ${{ runner.temp }}/reader-evidence/*/host/host-phase.json
            ${{ runner.temp }}/reader-evidence/*/host/host-error.json
            ${{ runner.temp }}/reader-evidence/*/*-blocked.json
          if-no-files-found: error
          retention-days: 14

  regression:
    # Reader qualification failures must not suppress independent safety evidence.
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '12400037968'
          run-id: '39718421643'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/regression-runtime
          merge-multiple: true
      - name: Prepare exact candidate test environment
        shell: pwsh
        run: |
          $runtime = "$env:RUNNER_TEMP/regression-runtime"
          if ((Get-FileHash "$runtime/inventory.json").Hash.ToLowerInvariant() -ne '9758f2a63e8815952ca91178a9c20397f4292ad2aca8bfbff0feeb3c87b80239') { throw 'Unverified native inventory' }
          & "$runtime/python.exe" -I -B scripts/launcher_candidate/inventory.py --root $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime custody failed' }
          uv python install cpython-3.14.8-windows-x86_64-none --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { throw 'Managed worker prerequisite failed' }
          uv venv --python "$runtime/python.exe" .venv
          if ($LASTEXITCODE -ne 0) { throw 'Candidate venv failed' }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: locks/test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked installation failed' }
          uv pip check --python .venv/Scripts/python.exe
      - name: Complete Windows suite including native Tk and isolated Edge fixtures
        id: tests
        shell: pwsh
        run: >-
          .venv/Scripts/python.exe -m pytest tests -p scripts.ci_tests --ci-workload windows -q
          --basetemp "$env:RUNNER_TEMP/candidate-full-tests"
          --ci-manifest "$env:RUNNER_TEMP/candidate-test-inventory.json"
          --ci-shard ${{ matrix.shard }}/2
          --junitxml "$env:RUNNER_TEMP/candidate-test-results.xml"
          -o junit_logging=no -o junit_log_passing_tests=false --durations=10
      - name: Retain exact native inventory status after suite completion or failure
        if: always() && steps.tests.outcome != 'skipped'
        shell: pwsh
        run: |
          $runtime = "$env:RUNNER_TEMP/regression-runtime"
          $inventory = Get-Content "$runtime/inventory.json" -Raw | ConvertFrom-Json
          $checks = @{}
          foreach ($entry in $inventory.files.PSObject.Properties) {
            $path = Join-Path $runtime $entry.Name
            $actual = if (Test-Path -LiteralPath $path -PathType Leaf) { (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
            $checks[$entry.Name] = @{expected=$entry.Value;actual=$actual;matches=($actual -eq $entry.Value)}
          }
          @{head=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;shard=${{ matrix.shard }};files=$checks} | ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP/post-suite-runtime.json"
          if (@($checks.Values | Where-Object { -not $_.matches }).Count) { throw 'Native runtime inventory changed during suite; retained exact member evidence' }
      - name: Reviewed managed worker bootstrap and verified reuse
        if: always() && steps.tests.outcome != 'skipped' && matrix.shard == 0
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m scripts.ci_runtime --profile production 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/worker-bootstrap.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Managed worker bootstrap/reuse failed' }
      - name: Retain synthetic regression evidence after failures
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-regression-shard${{ matrix.shard }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-test-inventory.json
            ${{ runner.temp }}/candidate-test-results.xml
            ${{ runner.temp }}/worker-bootstrap.txt
            ${{ runner.temp }}/post-suite-runtime.json
          if-no-files-found: error
          retention-days: 14

  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          checksum: '2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f'
          enable-cache: false
      - name: Install unchanged managed portable test environment
        run: |
          uv python install cpython-3.14.8-linux-x86_64-gnu --no-bin --no-registry
          uv venv --managed-python --python 3.14.8+gil .venv
          uv pip sync --python .venv/bin/python --require-hashes --only-binary :all: locks/test.txt
          uv pip check --python .venv/bin/python
          .venv/bin/python -m scripts.update_locks --check
      - name: Portable suite
        id: tests
        run: >-
          .venv/bin/python -m pytest tests -p scripts.ci_tests --ci-workload portable -q
          --basetemp "$RUNNER_TEMP/candidate-portable-tests"
          --ci-manifest "$RUNNER_TEMP/portable-test-inventory.json"
          --junitxml "$RUNNER_TEMP/portable-test-results.xml"
          -o junit_logging=no -o junit_log_passing_tests=false
      - name: Retain portable evidence
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-portable-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portable-test-inventory.json
            ${{ runner.temp }}/portable-test-results.xml
          if-no-files-found: error
          retention-days: 14

  regression-coverage:
    needs: [regression, portable]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: launcher-regression-shard*-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: launcher-portable-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: portable
      - name: Require exact full inventory and successful outcomes without gaps skips or duplicates
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
        run: |
          test "$REGRESSION_RESULT" = success
          test "$PORTABLE_RESULT" = success
          python3 -m scripts.ci_tests portable/portable-test-inventory.json \
            "evidence/launcher-regression-shard0-${GITHUB_SHA}-attempt${GITHUB_RUN_ATTEMPT}/candidate-test-inventory.json" \
            "evidence/launcher-regression-shard1-${GITHUB_SHA}-attempt${GITHUB_RUN_ATTEMPT}/candidate-test-inventory.json" \
            --python-version 3.14.8 --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

  dependency-audit:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          enable-cache: false
      - name: Install locked packages and separate audit tooling
        shell: pwsh
        run: |
          uv python install cpython-3.14.8-windows-x86_64-none --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { throw 'Managed interpreter installation failed' }
          foreach ($name in @('build','audit')) {
            uv venv --managed-python --python 3.14.8+gil ".$name"
            if ($LASTEXITCODE -ne 0) { throw 'Audit environment creation failed' }
            uv pip sync --python ".$name/Scripts/python.exe" --require-hashes --only-binary :all: "locks/$name.txt"
            if ($LASTEXITCODE -ne 0) { throw 'Locked installation failed' }
            uv pip check --python ".$name/Scripts/python.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Dependency check failed' }
          }
      - name: Audit runtime test build and auditor dependencies
        id: audit
        shell: pwsh
        run: >-
          .audit/Scripts/python.exe -m pip_audit --path .build/Lib/site-packages
          --path .audit/Lib/site-packages --strict --progress-spinner off
          --format json --output "$env:RUNNER_TEMP/candidate-dependency-audit.json"
      - name: Retain advisory results even after failure
        if: always() && steps.audit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-dependency-audit-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-dependency-audit.json
          if-no-files-found: error
          retention-days: 14

  performance-display:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '12400037968'
          run-id: '39718421643'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/observer-runtime
          merge-multiple: true
      - name: Verify candidate bytes and prepare clean reviewed baseline
        shell: pwsh
        run: |
          $runtime = "$env:RUNNER_TEMP/observer-runtime"
          if ((Get-FileHash "$runtime/inventory.json").Hash.ToLowerInvariant() -ne '9758f2a63e8815952ca91178a9c20397f4292ad2aca8bfbff0feeb3c87b80239') { throw 'Unverified native inventory' }
          & "$runtime/python.exe" -I -B scripts/launcher_candidate/inventory.py --root $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime custody failed' }
          uv python install cpython-3.14.8-windows-x86_64-none --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { throw 'Managed interpreter installation failed' }
          git worktree add --detach "$env:RUNNER_TEMP/reviewed-baseline" cfa30a41e1106b8b0565c44b46da6b4ffdba0b4d
          if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed' }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/observer-evidence" | Out-Null
          @{head=$env:GITHUB_SHA;tree=(git rev-parse 'HEAD^{tree}');run=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;image=$env:ImageVersion;os=[Environment]::OSVersion.VersionString;runtime_artifact=12400037968;observer_sha256=(Get-FileHash scripts/ui_delivery_performance.py).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/observer-evidence/custody.json"
      - name: Unchanged paired observer with managed Tcl Tk
        id: managed
        shell: pwsh
        run: |
          $python = uv python find --managed-python 3.14.8+gil
          & $python -B scripts/ui_delivery_performance.py --baseline "$env:RUNNER_TEMP/reviewed-baseline" --baseline-revision cfa30a41e1106b8b0565c44b46da6b4ffdba0b4d --candidate "$env:GITHUB_WORKSPACE" --candidate-revision "$env:GITHUB_SHA" --out "$env:RUNNER_TEMP/observer-evidence/managed"
          if ($LASTEXITCODE -ne 0) { throw 'Managed performance observation failed' }
      - name: Unchanged paired observer with candidate Tcl Tk on same runner
        if: always() && steps.managed.outcome != 'skipped'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/observer-runtime/python.exe" -B scripts/ui_delivery_performance.py --baseline "$env:RUNNER_TEMP/reviewed-baseline" --baseline-revision cfa30a41e1106b8b0565c44b46da6b4ffdba0b4d --candidate "$env:GITHUB_WORKSPACE" --candidate-revision "$env:GITHUB_SHA" --out "$env:RUNNER_TEMP/observer-evidence/candidate"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate performance observation failed' }
      - name: Actual display normal compact and High Contrast observations with restoration
        if: always() && steps.managed.outcome != 'skipped'
        shell: pwsh
        run: |
          powershell -NoProfile -STA -File scripts/ui_delivery_accessibility.ps1 -Python "$env:RUNNER_TEMP/observer-runtime/python.exe" -OutputDirectory "$env:RUNNER_TEMP/observer-evidence/display" -RequestLargeDisplay -IncludeHighContrast
          if ($LASTEXITCODE -ne 0) { throw 'Display observation failed; inspect retained phase and restoration' }
      - name: Retain raw samples payload hashes display observations and restoration
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-observers-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/observer-evidence/
          if-no-files-found: error
          retention-days: 14

  production-exclusion:
    # Diagnostic build from current source; never uploaded as a release payload.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          enable-cache: false
      - name: Build normal production mode from current candidate source
        shell: pwsh
        run: |
          uv python install cpython-3.14.8-windows-x86_64-none --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { throw 'Managed interpreter installation failed' }
          uv venv --managed-python --python 3.14.8+gil .venv
          if ($LASTEXITCODE -ne 0) { throw 'Build environment failed' }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: locks/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked build installation failed' }
          .venv/Scripts/python.exe -m scripts.ci_artifact build-info . --python-version 3.14.8
          if ($LASTEXITCODE -ne 0) { throw 'Build identity failed' }
          .venv/Scripts/python.exe build_desktop.py --python-profile production --output "$env:RUNNER_TEMP/production-exclusion"
          if ($LASTEXITCODE -ne 0) { throw 'Normal production mode build failed' }
      - name: Inspect actual CArchive and PYZ for candidate fixture exclusion
        shell: pwsh
        run: |
          @'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader
          root = Path(os.environ['RUNNER_TEMP']) / 'production-exclusion'
          exe = root / 'SPTDownloader.exe'
          archive = CArchiveReader(str(exe))
          members = sorted(archive.toc)
          pyz = {}
          for name, entry in archive.toc.items():
              if entry[-1] == 'z':
                  pyz[name] = sorted(archive.open_embedded_archive(name).toc)
          forbidden = [name for name in members + [n for entries in pyz.values() for n in entries]
                       if 'launcher_candidate' in name or 'candidate_probe' in name or 'candidate_fixture' in name]
          report = {'head': os.environ['GITHUB_SHA'], 'tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                    'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'exe_sha256': hashlib.sha256(exe.read_bytes()).hexdigest(), 'carchive': members, 'pyz': pyz,
                    'forbidden': forbidden, 'excluded': not forbidden}
          (root / 'bundle-exclusion.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          assert pyz and not forbidden, 'Candidate-only module present or PYZ unavailable'
          '@ | .venv/Scripts/python.exe -
          if ($LASTEXITCODE -ne 0) { throw 'Production bundle exclusion failed' }
      - name: Retain exclusion and frozen self-test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launcher-production-exclusion-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-exclusion/bundle-exclusion.json
            ${{ runner.temp }}/production-exclusion/build-selftest.json
          if-no-files-found: error
          retention-days: 14

  workflow-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate workflows with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --max-time 60 --output "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --status
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes=''
