name: Benchmark Windows test sharding

on:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Restore available production caches, or measure a cold setup
        type: choice
        default: restore
        options: [restore, cold]

permissions:
  contents: read

# Isolated from the production build and from its required branch check.
concurrency:
  group: windows-shard-benchmark-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  profile:
    name: Resolve the production benchmark profile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      production_python: ${{ steps.profile.outputs.production_python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the same runtime profile as production CI
        id: profile
        run: python3 -m scripts.ci_route route

  benchmark:
    name: Windows benchmark (${{ matrix.mode }})
    needs: profile
    runs-on: windows-2022
    # Use the production budget: the current serial suite can exceed 20 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [serial, shard-0, shard-1]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHON_VERSION: ${{ needs.profile.outputs.production_python }}
      BENCHMARK_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark setup timing after checkout
        run: python -m scripts.ci_report start
      - name: Set up pinned uv and read-only production integration cache
        id: uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.4'
          checksum: 'ccec7508a07d9933d7cb1261880633efcf1f30d6e6eddab21823f1dae6f23225'
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true
          save-cache: false
          restore-cache: ${{ inputs.cache_mode != 'cold' }}
          cache-dependency-glob: |
            requirements*.txt
            locks/*.txt
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-python${{ env.PYTHON_VERSION }}-integration
      - name: Install the identical hash-locked Windows test environment
        run: |
          python -I -S scripts/ci_python_cache.py --python-version "$env:PYTHON_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv python install "cpython-${env:PYTHON_VERSION}-windows-x86_64-none" --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --managed-python --python "$env:PYTHON_VERSION+gil" .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes --only-binary :all: locks/test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the complete synthetic Windows suite serially or as one shard
        id: tests
        env:
          CI_UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
          CI_PYTHON_CACHE_HIT: ${{ steps.uv.outputs.python-cache-hit }}
        run: |
          $pytestArgs = @(
            '-m', 'pytest', 'tests', '-p', 'scripts.ci_tests', '--ci-workload', 'windows',
            '-q', '--ci-benchmark', '--ci-manifest', "$env:RUNNER_TEMP/test-inventory.json",
            '--junitxml', "$env:RUNNER_TEMP/test-results.xml",
            '-o', 'junit_logging=no', '-o', 'junit_log_passing_tests=false',
            '--basetemp', "$env:RUNNER_TEMP/spt-pytest-benchmark", '--durations=10'
          )
          if ($env:BENCHMARK_MODE -ne 'serial') {
            $shardIndex = $env:BENCHMARK_MODE.Substring(6)
            $pytestArgs += @('--ci-shard', "$shardIndex/2")
          }
          & .venv/Scripts/python.exe @pytestArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Summarize synthetic test timing and outcomes
        if: always() && steps.tests.outcome != 'skipped'
        run: python -m scripts.ci_report report
      - name: Publish synthetic benchmark inventory and pytest timing
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-benchmark-${{ matrix.mode }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic JUnit and measurements even after test failure
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-benchmark-${{ matrix.mode }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-results.xml
            ${{ runner.temp }}/test-measurements.json
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Compare serial and 2-shard Windows tests
    needs: [profile, benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BENCHMARK_RESULT: ${{ needs.benchmark.result }}
      PYTHON_VERSION: ${{ needs.profile.outputs.production_python }}
    steps:
      - name: Require all three Windows benchmark variants to pass
        shell: bash
        run: test "$BENCHMARK_RESULT" = 'success'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download serial evidence from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-benchmark-serial-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-serial
      - name: Download shard 0 evidence from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-benchmark-shard-0-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-shard-0
      - name: Download shard 1 evidence from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-benchmark-shard-1-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-shard-1
      - name: Verify exact full coverage and compare measured pytest time
        shell: bash
        run: >-
          python3 -m scripts.ci_shard_benchmark
          "$RUNNER_TEMP/benchmark-serial/test-inventory.json"
          "$RUNNER_TEMP/benchmark-shard-0/test-inventory.json"
          "$RUNNER_TEMP/benchmark-shard-1/test-inventory.json"
          --python-version "$PYTHON_VERSION" --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --summary "$GITHUB_STEP_SUMMARY"
          --output "$RUNNER_TEMP/benchmark-comparison.json"
      - name: Publish machine-readable benchmark comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-benchmark-comparison-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-comparison.json
          if-no-files-found: error
          retention-days: 7
