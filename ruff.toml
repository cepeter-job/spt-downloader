# Gate minimum yang lolos saat ini.
# Perluasan seleksi disengaja dibatasi supaya CI tetap hijau;
# daftar aturan yang masih memiliki pelanggaran ditangani di PR tindak lanjut.
target-version = "py314"

[lint]
select = [
    "F821", "F822", "F823",   # nama yang tidak terdefinisi / forward reference
    "E9", "W6",              # syntax / runtime errors
    "F401",                  # impor mati; fixture/re-export harus eksplisit
    "B006", "B012", "B016", "B018", "B020",  # subset Bugbear yang ditinjau
]

[lint.pydocstyle]
convention = "google"
