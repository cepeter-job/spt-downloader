[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spt-downloader"
dynamic = ["version"]
description = "Coretax SPT downloader and export tool"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --durations=10"
