[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spt-downloader"
dynamic = ["version"]
description = "Coretax SPT downloader and export tool"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --durations=10"

[tool.coverage.run]
branch = true
relative_files = true
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
